<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق عزان المطور 🛒</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary: #00695c; --accent: #00bfa5; --bg: #e0f2f1; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* تصميم الهيدر (نمط الهوتسبوت) */
        .header { background: var(--primary); color: white; width: 100%; padding: 40px 0; text-align: center; border-radius: 0 0 50px 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: 1px; }

        /* حاوية الأزرار */
        .container { width: 90%; max-width: 500px; padding: 10px; }
        
        /* زر الماء المطور */
        .btn-water { 
            background: white; color: var(--primary); padding: 22px; border-radius: 25px; 
            border: none; font-weight: 900; width: 100%; font-size: 1.4rem; 
            cursor: pointer; margin-bottom: 20px; position: relative; overflow: hidden;
            transition: 0.3s; box-shadow: 0 6px 12px rgba(0,0,0,0.08); display: flex; flex-direction: column; align-items: center;
        }

        /* تأثير مائي عند الضغط */
        .btn-water:active { transform: scale(0.95); background: #b2dfdb; }
        
        .status-badge { font-size: 0.8rem; font-weight: 400; margin-top: 5px; padding: 4px 12px; border-radius: 12px; background: #f5f5f5; color: #757575; }
        .online { background: #c8e6c9 !important; color: #2e7d32 !important; font-weight: 700; }
    </style>
</head>
<body>

    <audio id="waterDrop" src="https://www.soundjay.com/nature/sounds/water-droplet-1.mp3" preload="auto"></audio>

    <div class="header">
        <h1>سوق عزان الموحد 🛒</h1>
    </div>

    <div class="container">
        <button class="btn-water" onclick="playWaterEffect()">
            🍔 قسم المطاعم
            <span id="st-1" class="status-badge">جاري الفحص...</span>
        </button>

        <button class="btn-water" onclick="playWaterEffect()">
            🍎 قسم البقالات
            <span id="st-2" class="status-badge">جاري الفحص...</span>
        </button>

        <div id="contestBox" style="display:none; background: #fff; padding: 20px; border-radius: 20px; border-top: 5px solid #ff6d00; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h3 style="color:#ff6d00; margin:0;">🌙 مسابقة رمضان</h3>
            <p id="qText" style="font-weight:900; color:#333; font-size: 1.2rem;"></p>
        </div>
    </div>

    <script>
        // إعدادات الربط المباشر بمشروعك
        const firebaseConfig = { databaseURL: "https://souq-tarim-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // وظيفة صوت الماء المطور
        function playWaterEffect() {
            const audio = document.getElementById('waterDrop');
            audio.currentTime = 0; // يصفر الوقت ليعمل الصوت فوراً عند كل ضغطة
            audio.play().catch(e => console.log("تحتاج للنقر أولاً"));
        }

        // مراقبة حالة الاتصال والبيانات
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                document.querySelectorAll('.status-badge').forEach(el => {
                    el.innerText = "● متصل الآن";
                    el.classList.add('online');
                });
            }
        });

        // جلب المسابقة تلقائياً
        db.ref('RamadanContest').on('value', (snap) => {
            const data = snap.val();
            if (data && data.status === 'on') {
                document.getElementById('contestBox').style.display = 'block';
                document.getElementById('qText').innerText = data.question;
            }
        });
    </script>
</body>
</html>
